apiVersion: v1
kind: ServiceAccount
metadata:
  name: crash-loop-remediator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crash-loop-remediator-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crash-loop-remediator-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: crash-loop-remediator
  namespace: default
roleRef:
  kind: Role
  name: crash-loop-remediator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crash-loop-remediator-cluster-role
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crash-loop-remediator-cluster-binding
subjects:
- kind: ServiceAccount
  name: crash-loop-remediator
  namespace: default
roleRef:
  kind: ClusterRole
  name: crash-loop-remediator-cluster-role
  apiGroup: rbac.authorization.k8s.io